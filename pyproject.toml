[project]
name = "ticket-shift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Ruszczyński", email = "mateusz.ruszczynski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ticket-shift = "ticket_shift:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
[tool.uv.build-backend]
module-name = "app"
module-root = ""
